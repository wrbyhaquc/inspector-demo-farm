<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farm simulator</title>
<style>
  :root { --bg: #11161c; --panel: #1b222b; --fg: #e8edf2; --muted: #93a1b0; --on: #2fbf71; --off: #3a4552; --accent: #f0b429; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, "Segoe UI", sans-serif; }
  .wrap { display: flex; flex-direction: column; gap: 16px; padding: 16px; }
  .cams { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cam { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 6px; display: block; }
  .side { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; align-items: start; }
  .box { background: var(--panel); border-radius: 8px; padding: 12px; }
  h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  button, select { font: inherit; color: var(--fg); background: var(--off); border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
  button.on { background: var(--on); color: #06210f; font-weight: 600; }
  button.act { background: var(--accent); color: #2a1c00; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .k { color: var(--muted); }
  #log { font-size: 12px; color: var(--muted); min-height: 90px; white-space: pre-line; margin-top: 8px; }
  details summary { cursor: pointer; color: var(--muted); }
  @media (max-width: 800px) { .cams { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="cams">
    <img class="cam" src="/greenhouse/video.mjpg" alt="greenhouse camera">
    <img class="cam" src="/coop/video.mjpg" alt="hen house camera">
  </div>
  <div class="side">
    <div class="box">
      <h2>Greenhouse</h2>
      <div class="row"><span>Roof vents</span><button id="vents">closed</button></div>
      <div class="row"><span>Sprinklers</span><span class="btns">
        <button class="act" data-send="water" data-value="1">Bed 1</button>
        <button class="act" data-send="water" data-value="2">Bed 2</button>
        <button class="act" data-send="water" data-value="3">Bed 3</button></span></div>
    </div>
    <div class="box">
      <h2>Hen house</h2>
      <div class="row"><span>Door</span><button id="door">open</button></div>
      <div class="row"><span>Fox alarm</span><button class="act" data-send="alarm">Sound it</button></div>
      <div class="row"><span>Eggs</span><button data-send="collect">Collect</button></div>
    </div>
    <div class="box">
      <h2>Demo</h2>
      <div class="grid">
        <button data-send="day">Day now</button><button data-send="dusk">Dusk now</button>
        <button data-send="night">Night now</button><button data-send="heat">Heat wave</button>
        <button data-send="dry" data-value="2">Bed 2 dry</button><button data-send="fox">Fox now</button>
        <button data-send="eggs" data-value="6">Lay 6 eggs</button><button data-send="restock">Reset</button>
        <select id="speed" title="real minutes per simulated day">
          <option value="2">1 day = 2 min</option><option value="6" selected>1 day = 6 min</option>
          <option value="30">1 day = 30 min</option><option value="1440">real time</option>
        </select>
      </div>
    </div>
    <div class="box">
      <details><summary>What the model knows (Inspector does not see this)</summary>
        <div id="state" class="k"></div></details>
      <div id="log"></div>
    </div>
  </div>
</div>
<script>
const send = (command, value) => fetch('/api/command', { method: 'POST', headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ command, value }) }).then(r => r.json()).then(show)
let last = null
function show(r) {
  const s = r.state || r
  last = s
  const v = document.getElementById('vents'); v.textContent = s.vents ? 'open' : 'closed'; v.classList.toggle('on', s.vents)
  const d = document.getElementById('door'); d.textContent = s.door ? 'open' : 'shut'; d.classList.toggle('on', s.door)
  const hh = String(Math.floor(s.hour)).padStart(2, '0'), mm = String(Math.floor(s.hour % 1 * 60)).padStart(2, '0')
  document.getElementById('state').textContent =
    `day ${s.day} ${hh}:${mm} · greenhouse ${s.temp} °C · moisture ${s.moisture.join(' / ')} % · ` +
    `hens ${s.hens} (${s.hens_out} out, the fox took ${s.lost}) · eggs ${s.eggs}`
  document.getElementById('log').textContent = (s.log || []).slice().reverse().join('\n')
  document.getElementById('speed').value = String(s.day_minutes)
}
document.getElementById('vents').onclick = () => send(last && last.vents ? 'vents_close' : 'vents_open')
document.getElementById('door').onclick = () => send(last && last.door ? 'door_close' : 'door_open')
document.querySelectorAll('[data-send]').forEach(b => b.onclick = () =>
  send(b.dataset.send, b.dataset.value === undefined ? undefined : Number(b.dataset.value)))
document.getElementById('speed').onchange = e => send('speed', Number(e.target.value))
setInterval(() => fetch('/api/state').then(r => r.json()).then(show), 1000)
fetch('/api/state').then(r => r.json()).then(show)
</script>
</body>
</html>
